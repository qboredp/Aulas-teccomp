<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>

</style>
<body>
  <header>
    <nav>
      <p >Menu 1</p>
      <p>Menu 2</p>
      <p>Menu 3</p>
    </nav>
  </header>
  <main>
    <h2 id="titulo">Aula 3 - Javascript DOM</h2>
    <p class="comandos">getElementById</p>
    <p class="comandos">getElementsByTagName</p>
    <p class="comandos">getElementsByClassName</p>
    <p>Comandos para pegar os elementos.</p>
  </main>
   <script>
     document.getElementsByTagName('p')[0].innerHTML='item 1';
     document.getElementsByTagName('p')[1].innerHTML='item 2';
     document.getElementsByClassName("comandos")[0].innerHTML='(getElementById)';
     document.getElementsByClassName("comandos")[1].innerHTML='(getElementsByTagName)';
     document.getElementsByClassName("comandos")[2].innerHTML='(getElementsByClassName)';
     
  </script> 
</body>
</html>
