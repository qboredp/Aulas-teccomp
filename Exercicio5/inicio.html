<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="mensagem"></h1>
  <a href="perfil.html">Ir para o perfil</a>

  <script>
    let usuario = localStorage.getItem("usuario");
    if (usuario==""){
      window.location.href = "login.html"
    } else{
      document.getElementById("mensagem").textContent = "Bem-vindo, " + usuario + "!";
    }
  </script>
</body>
</html>
